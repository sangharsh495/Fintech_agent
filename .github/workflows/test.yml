name: FinFlow CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # This project uses pnpm — there is no package-lock.json, so `npm ci`
      # and `cache: npm` both fail before any code runs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Placeholder credentials: several modules construct a database client at
      # module scope, so collecting page data needs syntactically valid URLs.
      # Nothing here connects to a real database.
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost.tld/ci
          APP_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost.tld/ci
          NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
        run: pnpm build
